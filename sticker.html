<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleccionar Stickers</title>
    <link rel="stylesheet" href="./assets/css/stickers.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <a href="./index.html" class="nav-link">Home</a>
      <a href="./sticker.html" class="nav-link">Sticker</a>
      <a href="./password.html" class="nav-link">Password</a>
    </nav>
    <div class="container">
      <h1>Puedes llevar hasta 10 stickers en total</h1>
      <div class="stickers-container">
        <div class="sticker">
          <img src="./assets/img/banana1.webp" alt="Sticker 1" />
          <input type="number" id="sticker1" placeholder="0" min="0" max="10" />
        </div>
        <div class="sticker">
          <img src="./assets/img/banana2.webp" alt="Sticker 2" />
          <input type="number" id="sticker2" placeholder="0" min="0" max="10" />
        </div>
        <div class="sticker">
          <img src="./assets/img/banana3.webp" alt="Sticker 3" />
          <input type="number" id="sticker3" placeholder="0" min="0" max="10" />
        </div>
      </div>
      <button id="calcular">Verificar</button>
      <p id="resultado"></p>
    </div>

    <script src="./assets/js/stickers.js"></script>
  </body>
</html>
